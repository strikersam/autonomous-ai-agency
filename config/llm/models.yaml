  # Neither has answered a completion: both return 402 Payment Required. So the
  # capability numbers below are conservative floors, not measurements, on the
  # same principle as the NVIDIA entries — a floor prunes a prompt, an
  # overstatement overflows it. supports_tools stays false because nothing has
  # demonstrated a tool_call; packages/llm/registry.py reads that flag to filter
  # tool-calling requests, so claiming it without evidence routes work to a model
