# config/llm/models.yaml — model capabilities, limits, and pricing.
#
# The router filters candidates against these declarations before it routes,
# so a tool-calling request never reaches a model that cannot call tools and a
# 200k-token prompt never reaches an 8k-context model.
#
# Declare capabilities conservatively. A false "supports_tools: true" produces
# a confusing runtime failure; a false "false" only costs one routing option.
#
# Costs are USD per 1M tokens. Zero means free — the cost_optimized strategy
# and the free-brain policy both key off it.
#
# Models discovered at runtime through /models endpoints are registered
# automatically with cautious defaults; entries here always win.

models:

  # ── NVIDIA NIM (free) ──────────────────────────────────────────────────

  # ── NVIDIA NIM: probed live, 2026-08-28 ────────────────────────────────
  #
  # Every field below was *measured* by .github/workflows/catalogue-probe.yml
  # against the production key — `--chat` for "does it serve", `--tools` for
  # "does it emit a tool_call". Nothing here is copied from a model card.
  #
  # `context_window` and `max_output_tokens` are deliberately omitted: NVIDIA's
  # /v1/models returns only id/object/created/owned_by, so those numbers cannot
  # be read from the provider, and inventing them is what this whole line of
  # work has been undoing. Omitting them inherits the conservative defaults in
  # packages/llm/config.py (8192 / 4096), which prune prompts rather than
  # overflow them. Raise them when someone measures the real limits.
  #
  # These entries exist because packages/llm/registry.py gives any undeclared
  # model `supports_tools: false` and filters tool-calling requests on it — so
  # an undeclared model is silently dropped from every tool-calling request.

  nvidia/nemotron-3-super-120b-a12b:
    provider: nvidia
    display_name: Nemotron 3 Super 120B-a12b
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    supports_reasoning: true        # probed: reply began with visible reasoning
    priority: 10
    speed_tier: fast                # ~12B active params/token

  openai/gpt-oss-120b:
    provider: nvidia
    display_name: GPT-OSS 120B (NIM)
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    priority: 25

  openai/gpt-oss-20b:
    provider: nvidia
    display_name: GPT-OSS 20B (NIM)
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    priority: 30

  # ── Cerebras (free, fastest) ───────────────────────────────────────────
  # Free tier: 1M tokens/day. All Cerebras models run on wafer-scale hardware
  # at 1,000–2,000 tok/s sustained — dramatically faster than GPU inference.

  qwen-3-235b-a22b-instruct-2507:
    provider: cerebras
    display_name: Qwen3 235B A22B Instruct (2507)
    context_window: 262144           # 262k tokens: verified in Cerebras docs
    max_output_tokens: 16384
    supports_tools: true             # Qwen3 instruct series fully supports tool_calls
    supports_function_calling: true
    supports_json: true
    supports_streaming: true
    supports_reasoning: false        # Non-thinking variant; use qwen-3-235b-a22b-thinking-2507 for CoT
    input_cost_per_1m: 0.0           # free tier (1M tokens/day); Cerebras pay-as-you-go: $0.60/$1.20
    output_cost_per_1m: 0.0
    priority: 9                      # Highest-priority free Cerebras model (235B > 480B-coder)
    speed_tier: fast                 # ~1,500 tok/s on Cerebras wafer-scale
    max_requests_per_minute: 30
    aliases: [qwen3-235b, cerebras-qwen3-235b]

  qwen-3-coder-480b:
    provider: cerebras
    display_name: Qwen 3 Coder 480B
    context_window: 32768
    max_output_tokens: 8192
    supports_tools: true
    supports_function_calling: true
    supports_json: true
    supports_streaming: true
