# config/llm/models.yaml — model capabilities, limits, and pricing.
#
# The router filters candidates against these declarations before it routes,
# so a tool-calling request never reaches a model that cannot call tools and a
# 200k-token prompt never reaches an 8k-context model.
#
# Declare capabilities conservatively. A false "supports_tools: true" produces
# a confusing runtime failure; a false "false" only costs one routing option.
#
# Costs are USD per 1M tokens. Zero means free — the cost_optimized strategy
# and the free-brain policy both key off it.
#
# Models discovered at runtime through /models endpoints are registered
# automatically with cautious defaults; entries here always win.

models:

  # ── NVIDIA NIM (free) ──────────────────────────────────────────────────

  # ── NVIDIA NIM: probed live, 2026-08-28 ────────────────────────────────
  #
  # Every field below was *measured* by .github/workflows/catalogue-probe.yml
  # against the production key — `--chat` for "does it serve", `--tools` for
  # "does it emit a tool_call". Nothing here is copied from a model card.
  #
  # `context_window` and `max_output_tokens` are deliberately omitted: NVIDIA's
  # /v1/models returns only id/object/created/owned_by, so those numbers cannot
  # be read from the provider, and inventing them is what this whole line of
  # work has been undoing. Omitting them inherits the conservative defaults in
  # packages/llm/config.py (8192 / 4096), which prune prompts rather than
  # overflow them. Raise them when someone measures the real limits.
  #
  # These entries exist because packages/llm/registry.py gives any undeclared
  # model `supports_tools: false` and filters tool-calling requests on it — so
  # an undeclared model is silently dropped from every tool-calling request.

  nvidia/nemotron-3-super-120b-a12b:
    provider: nvidia
    display_name: Nemotron 3 Super 120B-a12b
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    supports_reasoning: true        # probed: reply began with visible reasoning
    priority: 10
    speed_tier: fast                # ~12B active params/token

  openai/gpt-oss-120b:
    # Served by both NVIDIA NIM and Groq (probed live on each account). One
    # catalogue entry, two providers — see ModelConfig.extra_providers.
    providers: [nvidia, groq]
    display_name: GPT-OSS 120B
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    priority: 25

  openai/gpt-oss-20b:
    providers: [nvidia, groq]
    display_name: GPT-OSS 20B
    supports_tools: true            # probed: returned tool_calls[get_weather]
    supports_function_calling: true
    supports_streaming: true
    priority: 30

  # Mistral NeMo-Tron: Mistral NeMo 12B fine-tuned by NVIDIA for instruction
  # following. Available on NVIDIA NIM free tier. Not yet live-probed for tool
  # calls on this account — declared to unblock routing; `supports_tools: false`
  # is the safe default until probed. Source: build.nvidia.com, 2026-09-19.
  mistralai/mistral-nemotron:
    provider: nvidia
    display_name: Mistral NeMo-Tron (NVIDIA NIM)
    context_window: 131072
    supports_tools: false           # not probed — conservative default
    supports_function_calling: false
    supports_streaming: true
    priority: 33
    speed_tier: fast

  # Nemotron 3 Ultra 550B: NVIDIA's largest NIM model. 550B MoE parameters.
  # Listed as intermittent — 404'd at 17:02/17:05 on 2026-08-28 but answered
  # HTTP 200 with a real tool_call at 23:25. Placed behind default as fallback.
  # Not freshly probed on 2026-09-19 — conservative `supports_tools: false`
  # declared to enable routing without claiming unverified tool capability.
  nvidia/nemotron-3-ultra-550b-a55b:
    provider: nvidia
    display_name: Nemotron 3 Ultra 550B-a55b (NVIDIA NIM)
    supports_tools: false           # not freshly probed
    supports_function_calling: false
    supports_streaming: true
    priority: 34
    speed_tier: slow

  # DeepSeek V4.1-Flash on NVIDIA NIM: NIM-accelerated deployment of DeepSeek's
  # V4.1-Flash model detected in the NIM catalogue 2026-09-22. 552B MoE,
  # multimodal (text + images), 1M-token context. Same model as ``deepseek-flash``
  # on the DeepSeek direct API, served here via NIM with no API cost.
  # Not yet live-probed on this account — conservative ``supports_tools: false``
  # until probed. Source: NVIDIA NIM catalogue tracker, 2026-09-22.
  deepseek-ai/deepseek-v4.1-flash:
    provider: nvidia
    display_name: DeepSeek V4.1-Flash (NVIDIA NIM)
    context_window: 1000000
    supports_tools: false           # not probed on NIM — conservative default
    supports_function_calling: false
    supports_images: true
    supports_streaming: true
    supports_reasoning: true
    priority: 35
    speed_tier: fast

  # Kimi K2: Moonshot AI MoE model hosted on Groq (Aug 2026). ~1M context,
  # function calling supported. Groq self-serve tier: $1.00/$3.00 per MTok
  # (most expensive offering on Groq's self-serve catalogue as of Sep 2026).
