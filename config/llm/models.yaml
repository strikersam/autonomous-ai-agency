    max_output_tokens: 16384
    supports_tools: true
    supports_function_calling: true
    supports_json: true
    supports_streaming: true
    input_cost_per_1m: 1.00
    output_cost_per_1m: 3.00
    priority: 36
    speed_tier: fast

