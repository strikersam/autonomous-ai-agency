    speed_tier: medium

  # ── Cerebras (free, fastest) ───────────────────────────────────────────

  # Probed 2026-08-29 (run 33259357211): the account's /v1/models returns these
  # two and nothing else. qwen-3-coder-480b, which used to be the entry here and
  # the provider default, answers 404 — it was never on this account.
