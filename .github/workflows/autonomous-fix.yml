name: Autonomous Fix

# Monitors PRs with failing CI tests and automatically fixes them.
# Runs every 30 minutes. For each PR with failing tests:
# 1. Fetches the actual pytest failure from the job log (not just a raw tail)
# 2. Calls the configured brain to generate a minimal fix
# 3. Runs the proposed fix through the same slop-gate autonomous_agent.py uses
#    (destructive-overwrite / secret-file / syntax checks), a hard denylist for
#    CI workflow files and shared test infra, and a local pytest -x re-run —
#    before ever touching disk on the real branch
# 4. Pushes the fix only if all of the above pass; otherwise declines with a
#    PR comment explaining why, and gives up after 2 attempts on the same PR
#    rather than retrying indefinitely
#
# See .github/scripts/autonomous_fix.py and .github/scripts/slop_gate.py.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to fix (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: autonomous-fix
  cancel-in-progress: false

jobs:
  fix-failing-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install deps
        run: pip install httpx pytest pytest-timeout 2>&1 | tail -3

      - name: Find and fix failing PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Recommended free-cloud brain chain (Cerebras -> Groq -> NVIDIA NIM),
          # selected by which key is present — mirrors autonomous_agent.py so
          # both auto-PR scripts upgrade together.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        run: python3 .github/scripts/autonomous_fix.py
