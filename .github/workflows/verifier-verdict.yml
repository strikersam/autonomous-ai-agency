name: Verifier Verdict

# Merge gate for CLAUDE.md rule 49: every PR needs a PASS or PASS+NOTES verdict
# from an independent verifier (a line "Verdict: PASS" in the PR body or in a
# comment by the PR author, the repo owner or GitHub Actions). A later FAIL
# blocks again. Dependabot and PRs labelled verifier-exempt pass.
#
# The result is published as the commit status "Verifier verdict" on the PR's
# head commit, so a verdict posted as a comment updates the PR (a check run from
# an issue_comment event would attach to the default branch instead). To make
# it blocking, add "Verifier verdict" to master's required status checks.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: verifier-verdict-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verdict:
    name: Verifier verdict (evaluate)
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Check verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 .github/scripts/verifier_verdict.py
