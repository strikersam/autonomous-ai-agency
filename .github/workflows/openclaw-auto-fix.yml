name: OpenClaw Auto-Fix

on:
  schedule:
    # Run weekly on Sundays at 03:00 UTC for ongoing auto-remediation
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      fix_bandit:
        description: "Auto-fix Bandit SAST findings"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  security-events: write
  pull-requests: write

concurrency:
  group: openclaw-autofix
  cancel-in-progress: true

jobs:
  scan-and-fix:
    name: Scan & Auto-Fix Security Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Bandit is a static AST scanner — it does not need the project's
        # runtime deps (boto3/motor/pymongo/etc.) and heavy installs run
        # the risk of timing out under the default cloud install budget.
        run: |
          pip install --quiet bandit

      - name: Run Bandit SAST scan
        id: bandit
        run: |
          # Scan output goes to $RUNNER_TEMP, never into the repo working
          # tree — a prior version wrote it to ./bandit-results.json and the
          # "git add -A" two steps down committed the whole 14k-line scan
          # (PR #1486). Run bandit; if it fails to produce output (e.g. not
          # installed), create an empty results file so the next step
          # doesn't crash.
          RESULTS="$RUNNER_TEMP/bandit-results.json"
          bandit -r . -f json -o "$RESULTS" --exit-zero -q \
            --severity-level medium \
            --skip B101,B311 \
            --exclude .venv,node_modules,tests,.git 2>/tmp/bandit-err.log || true
          if [ -s /tmp/bandit-err.log ]; then
            echo "::warning::Bandit stderr:\n$(head -20 /tmp/bandit-err.log)"
          fi
          # If the results file wasn't written (install failure, etc.),
          # create a valid empty results file.
          if [ ! -f "$RESULTS" ]; then
            echo '{"results":[]}' > "$RESULTS"
          fi
          ISSUE_COUNT=$(python3 -c "import json; d=json.load(open('$RESULTS')); print(len(d.get('results',[])))" 2>/dev/null || echo 0)
          echo "count=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Bandit found $ISSUE_COUNT issues"

      - name: Create PR for auto-fixes
        if: steps.bandit.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="auto/openclaw-security-fix-$(date +%Y%m%d)"
          git config user.name "openclaw[bot]"
          git config user.email "openclaw[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || true

          # Auto-fix safe patterns: replace str(e) in error responses — but
          # only where the exception is a genuinely broad except (bare
          # except: / except Exception) AND the response is a real 5xx.
          # See .github/scripts/openclaw_str_e_fix.py for why: a naive
          # blanket regex here previously rewrote deliberately-authored,
          # safe 400/404 ValueError messages into a nonsensical "Internal
          # server error" (PR #1486).
          python3 .github/scripts/openclaw_str_e_fix.py

          # Never let this workflow's own scan output (or any other
          # untracked file) slip into the commit — PR #1486 committed a
          # 14k-line bandit-results.json this way.
          git add -A -- . ':!bandit-results.json' ':!bandit-report.json'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "fix(security): auto-fix str(e) stack-trace exposure (OpenClaw)"
          git push origin "$BRANCH" || { echo "Push failed"; exit 0; }

          cat > /tmp/pr_body.md <<'BODYEOF'
          ## Automated Security Fix (OpenClaw)

          This PR was automatically generated by the OpenClaw security auto-fix workflow.

          ### Changes
          - Replaced `str(exc)` with a generic message in `HTTPException` responses,
            but only where `.github/scripts/openclaw_str_e_fix.py` judged it safe:
            the exception is caught by a genuinely broad handler (bare `except:` /
            `except Exception`) *and* the response status is a real 5xx. A specific
            exception type (e.g. `ValueError`) or a 4xx status is left untouched —
            those are typically deliberate, author-written client-facing messages.

          ### Validation
          - All existing tests should continue to pass
          - This is a minimal, targeted change — only the flagged `str(exc)` call sites are modified
          BODYEOF
          gh pr create \
            --title "fix(security): OpenClaw auto-fix security alerts" \
            --body-file /tmp/pr_body.md \
            --label "security,automated" \
            --draft || echo "PR creation failed or already exists"
