name: Auto-merge PR

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run when CI succeeded and a PR was actually associated with the run.
    # On push events workflow_run.pull_requests is [] (empty array) which is
    # truthy in GHA — we must check for at least one entry.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null }}
    steps:
      - name: Get PR number from the workflow run
        id: pr
        run: |
          PR_NUMBER=$(echo '${{ toJSON(github.event.workflow_run.pull_requests) }}' | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR associated with this workflow run — skipping"
            echo "pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Merge PR
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # This job has no checkout, so every gh call needs --repo. Without it
          # `gh pr merge` died with "not a git repository" on every run, the
          # `|| {}` below turned that into a warning, and the draft/planning
          # guards read their fallbacks ("false"/"") — nothing ever merged.
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          # SAFETY: never auto-merge a draft PR. Draft PRs created by
          # issue-context-generator contain only a planning doc (docs/context/*.md)
          # — they are "yet to be implemented" and must not be closed by housekeeping
          # or auto-merge. Also skip PRs labelled quick-note:planning as belt-and-suspenders.
          IS_DRAFT=$(gh pr view "$PR_NUMBER" --json isDraft -q '.isDraft' 2>/dev/null || echo "false")
          HAS_PLANNING=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name | select(. == "quick-note:planning")' 2>/dev/null || echo "")
          if [ "$IS_DRAFT" = "true" ] || [ -n "$HAS_PLANNING" ]; then
            echo "Skipping PR #$PR_NUMBER — draft PR (isDraft=$IS_DRAFT) or labelled quick-note:planning."
            echo "Draft PRs are planning docs only and must be implemented by the agent before merge."
            exit 0
          fi
          # SAFETY: never auto-merge autonomous agency PRs (agent/* branches).
          # PRs #842/#843 were low-value boilerplate from vague issues that the
          # slop-gate couldn't catch because they were additive. Agency PRs need
          # human review before merge.
          HEAD_BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName' 2>/dev/null || echo "")
          if echo "$HEAD_BRANCH" | grep -qE '^agent/'; then
            echo "Skipping PR #$PR_NUMBER — agency branch ($HEAD_BRANCH) requires human review before merge."
            exit 0
          fi
          # Dependabot PRs belong to dependabot-auto-merge.yml, which holds
          # major bumps for a human (rule 40).
          if echo "$HEAD_BRANCH" | grep -qE '^dependabot/'; then
            echo "Skipping PR #$PR_NUMBER — Dependabot PRs are merged by dependabot-auto-merge.yml."
            exit 0
          fi
          if [ -z "$HEAD_BRANCH" ]; then
            echo "::warning::PR #$PR_NUMBER metadata unreadable — not merging blind."
            exit 0
          fi
          echo "Queueing PR #$PR_NUMBER for merge once every required check is green..."
          # --auto, never --admin. "CI succeeded" is one workflow; Security Gate,
          # CodeQL and the rest are separate required checks that may still be
          # pending or red. --admin skipped them: #1873 merged on 2026-11-01 with
          # Security Gate red (+12 Bandit alerts on master), and #1863 merged with
          # its required Python tests skipped. --auto lets GitHub merge only when
          # branch protection is satisfied. --match-head-commit pins the commit CI
          # passed, so a later untested push is never merged.
          gh pr merge "$PR_NUMBER" --squash --auto \
            --match-head-commit "${{ github.event.workflow_run.head_sha }}" || {
            echo "::warning::Could not queue auto-merge (conflicts, stale head, or auto-merge disabled). Manual merge may be needed."
            exit 0
          }
