name: Deploy Backend to Render

on:
  push:
    branches: [master]
    paths:
      # --- Dockerfile.backend copies all of these ---
      - 'backend/**'
      - 'agent/**'
      - 'agents/**'
      - 'router/**'
      - 'runtimes/**'
      - 'tasks/**'
      - 'handlers/**'
      - 'workflow/**'
      - 'mcp_server/**'
      - 'schedules/**'
      - 'docker/**'
      - 'sync/**'
      - 'setup/**'
      - 'hardware/**'
      - 'services/**'
      - 'models/**'
      - 'db/**'
      # These four are COPYed by Dockerfile.backend but were missing here, so a
      # change confined to any of them shipped no deploy at all. packages/ holds
      # the whole AI layer (router, brain config, providers, traffic director);
      # loops/ the loop registry; voice/ the TTS + SAM pipeline; .claude/ the
      # skill descriptors /api/skills indexes at runtime.
      - 'packages/**'
      - 'loops/**'
      - 'voice/**'
      - '.claude/**'
      # config/ holds the LLM router's runtime YAML (providers, models,
      # routing, keys, health, cache). Every file is optional by design, so a
      # stale or absent config degrades silently to env-derived defaults
      # instead of erroring — which means a routing change that never deploys
      # looks exactly like one that did. Retuning a provider's
      # tokens_per_minute must reach production on its own.
      - 'config/**'
      # Dockerfile.backend now builds the React SPA from frontend/ source (the
      # multi-stage frontend-build stage) and bakes it into the image, so a
      # frontend-only change must redeploy the backend too — otherwise the
      # backend-served UI stays on the old bundle until an unrelated change.
      - 'frontend/**'
      # Dockerfile.backend ships root modules wholesale (`COPY *.py ./`) after
      # one-by-one copying repeatedly dropped newly-added modules from the
      # image. This filter listed 11 files by name, so the same drift lived on
      # here: 24 root modules that ARE in the image — proxy.py, chat_handlers.py,
      # telegram_bot.py, output_filter.py, app_settings.py and the rest — could
      # change without deploying. Match the Dockerfile: take them all.
      - '*.py'
      # also deploy if the Dockerfile or this workflow changes
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'manual trigger'

# Minimal permissions — this workflow only calls an external webhook
permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    # No additional permissions needed beyond the workflow-level read
    steps:
      - name: Validate deploy hook secret is set
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing."
            echo "Render dashboard -> local-llm-server -> Settings -> Deploy Hook -> copy URL"
            exit 1
          fi

      - name: Trigger Render deployment
        run: |
          echo "Triggering Render deploy for commit ${{ github.sha }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Accept: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -gt 299 ]; then
            echo "::error::Render deploy hook returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy triggered successfully (HTTP $HTTP_CODE)"

      - name: Verify the new build is actually live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://local-llm-server.onrender.com/api/health
        run: |
          # This step used to poll for *any* 200 starting 20s after triggering
          # the deploy, and `exit 0` on timeout. Render keeps the previous
          # instance serving until the new image builds, and this image builds
          # a React bundle and installs Chromium — so the old instance answered
          # within 20s and the job went green while the Render build failed.
          # Two changes: wait for the commit we just pushed, and fail loudly.
          echo "Waiting for $EXPECTED_SHA to come live at $HEALTH_URL"
          MAX_ATTEMPTS=40      # 40 x 30s = 20 minutes
          SLEEP_SECONDS=30
          ATTEMPT=0
          UNVERIFIABLE=0
          sleep 60             # don't bother polling before a build can finish

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            BODY=$(curl -sf --max-time 15 "$HEALTH_URL" || true)
            if [ -n "$BODY" ]; then
              LIVE_SHA=$(printf '%s' "$BODY" | jq -r '.commit // empty')
              if [ -n "$LIVE_SHA" ]; then
                if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                  echo "Live commit matches: $LIVE_SHA"
                  exit 0
                fi
                echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — live commit is ${LIVE_SHA:0:7}, still the old build"
              else
                # The host stamped no commit (RENDER_GIT_COMMIT unset, or the
                # running image predates /api/health reporting it). We cannot
                # tell old from new, so accept reachability rather than fail a
                # deploy we have no evidence against — but say so.
                UNVERIFIABLE=1
                echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — health OK but no commit reported"
                if [ "$ATTEMPT" -ge 4 ]; then
                  echo "::warning::Backend is up but does not report a build commit, so this deploy could not be verified. Set RENDER_GIT_COMMIT in the Render dashboard (Environment -> Add from Render), or wait for the first deploy that ships the commit-reporting /api/health."
                  exit 0
                fi
              fi
            else
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — health endpoint not responding"
            fi
            sleep "$SLEEP_SECONDS"
          done

          if [ "$UNVERIFIABLE" = "1" ]; then
            echo "::warning::Could not verify the deployed commit; backend was reachable throughout."
            exit 0
          fi
          echo "::error::$EXPECTED_SHA never went live after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          echo "Check the Render build log: https://dashboard.render.com -> local-llm-server -> Events"
          exit 1
