name: Enrich Quick-Note Context

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Detection only — this workflow no longer writes to issues. It finds
# quick-note issues with no context document and dispatches the bulk context
# generator, which owns generation. `actions: write` is what lets it dispatch.
permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: quick-note-context-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Queue context generation for quick-note issues missing it
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/enrich_quick_note_issues.py
