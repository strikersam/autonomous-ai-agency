name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The pull_request trigger fires exactly once per PR. Any failure at that
  # moment strands the PR forever — which is precisely what happened: an empty
  # GH_TOKEN killed the merge step on open, nothing ever retried, and 13 green
  # Dependabot PRs accumulated. The sweep below re-attempts every open
  # Dependabot PR daily so a single bad run can no longer park one permanently.
  # Hourly, not daily. Branch protection requires an up-to-date branch, so
  # merging one PR puts every other open one BEHIND again — the backlog drains
  # at one PR per run no matter how many the sweep touches. At daily that is 14
  # days to clear a batch Dependabot refills weekly, so it could never catch up.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge safe Dependabot updates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          # Use the built-in GITHUB_TOKEN for metadata fetching — the
          # dependabot/fetch-metadata action requires this (a PAT like GH_PAT
          # causes "github-token is not set!" because the action validates
          # the token differently). The built-in GITHUB_TOKEN is automatically
          # available in every Actions run and has read access to PR metadata.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch and minor version bumps.
      #
      # MUST use secrets.GITHUB_TOKEN, not secrets.GH_PAT. GitHub withholds
      # repository secrets from workflows triggered by dependabot[bot], so
      # `${{ secrets.GH_PAT }}` expanded to an empty string and every run died
      # with "gh: To use GitHub CLI in a GitHub Actions workflow, set the
      # GH_TOKEN environment variable" (exit 4) — while the fetch-metadata step
      # above succeeded on the very same event, because GITHUB_TOKEN is the
      # special Actions token rather than a repo secret. That is why all 13 open
      # Dependabot PRs sat green and unmerged: this job had never once worked.
      #
      # GITHUB_TOKEN cannot bypass branch protection, so `--admin` is out;
      # `--auto` is the right tool anyway — GitHub merges the PR itself once
      # required checks pass, instead of forcing it through ahead of them. The
      # job-level `permissions:` block above grants the write scopes it needs.
      - name: Auto-merge patch / minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Fall back to a direct squash if the repo has "Allow auto-merge"
          # switched off, in which case --auto is rejected outright.
          gh pr merge --auto --squash "$PR_URL" \
            || gh pr merge --squash "$PR_URL"

      # Comment on major bumps for human review — don't auto-merge
      - name: Flag major update for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" \
            --body "⚠️ **Major version bump** — auto-merge skipped. Please review breaking changes before merging."

  # ── Recovery sweep ─────────────────────────────────────────────────────────
  # Re-attempts every open Dependabot PR. Exists because the event-driven job
  # above gets one shot per PR: when it failed (empty GH_TOKEN), the PR was
  # stranded with no path back. This sweep is the retry that was missing.
  #
  # It cannot lean on that job for classification. The job is guarded by
  # `github.actor == 'dependabot[bot]'`, and once this sweep updates a stale
  # branch with GH_PAT the actor is a real user, so it skips — verified on
  # PR #1336 (run 32936415712, actor strikersam, conclusion "skipped"). Without
  # a verdict of its own the sweep would have armed auto-merge on
  # `anthropic >=0.122.0 -> >=1.0.0` with nothing left in the loop to object.
  # scripts/classify_dependabot_update.py is that verdict, and is unit-tested
  # against all 14 of the PRs this sweep was written for.
  sweep-stranded:
    name: Re-attempt stranded Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # A grouped npm update can leave frontend/package-lock.json out of sync
      # with package.json (#1541: "Missing: yaml@2.9.1 from lock file"), so
      # `npm ci` fails before any test runs and the PR sits red forever —
      # Dependabot does not regenerate it on its own. Regenerate the lockfile
      # and push with GH_PAT so CI re-runs (a GITHUB_TOKEN push would not).
      # After a foreign commit Dependabot refuses `@dependabot rebase`, so the
      # DIRTY path below would stall on such a PR; Dependabot recreates it on
      # its next update run, which drops this commit and re-applies the fix.
      - name: Repair out-of-sync frontend lockfiles
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT unset — a GITHUB_TOKEN push would not re-run CI; skipping."
            exit 0
          fi
          BRANCHES=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" \
                       --json headRefName \
                       --jq '.[].headRefName | select(startswith("dependabot/npm_and_yarn/frontend/"))')
          [ -z "$BRANCHES" ] && { echo "No open frontend npm PRs."; exit 0; }
          git config user.name "dependabot-lockfile-repair"
          git config user.email "noreply@github.com"
          # Credential helper, not a token in the remote URL (CLAUDE.md rule 42).
          # actions/checkout leaves a GITHUB_TOKEN auth header that would win
          # over the helper and make the push one that never triggers CI.
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          for b in $BRANCHES; do
            echo "::group::$b"
            git fetch -q origin "$b" && git checkout -q -B lockfix "origin/$b" || { echo "::endgroup::"; continue; }
            if (cd frontend && npm ci --dry-run --ignore-scripts --no-audit --no-fund >/dev/null 2>&1); then
              echo "Lockfile in sync."
            else
              (cd frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
              if git diff --quiet -- frontend/package-lock.json; then
                echo "::warning::npm ci fails on $b but regenerating the lockfile changed nothing."
              else
                git add frontend/package-lock.json
                git commit -q -m "chore(deps): regenerate frontend lockfile so npm ci resolves"
                git push -q origin "HEAD:$b" || echo "::warning::push to $b failed."
              fi
            fi
            echo "::endgroup::"
          done
          git checkout -q "$GITHUB_SHA"

      - name: Unblock every open Dependabot PR
        env:
          # NOT the GITHUB_TOKEN the job above must use. That job runs on a
          # dependabot[bot] event, where GitHub withholds repository secrets and
          # GH_PAT expands to "". This job runs on schedule/dispatch, so secrets
          # are available — and it needs them, because a merge commit created by
          # GITHUB_TOKEN does not trigger workflows. When the sweep updated 10
          # branches with it, every resulting run came back `action_required`
          # (CI run 32934966004 on PR #1345, against run 32696410024 which had
          # passed on the same branch): the update replaced green checks with
          # checks awaiting a human click. With GH_PAT the same update produced
          # run 32936354170, actor strikersam, which ran normally.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEW_MARKER: "Major version bump"
          REBASE_MARKER: "@dependabot rebase"
        run: |
          set -u
          PRS=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" \
                  --json number --jq '.[].number')
          if [ -z "$PRS" ]; then
            echo "No open Dependabot PRs — nothing to sweep."
            exit 0
          fi
          echo "Open Dependabot PRs: $(echo "$PRS" | tr '\n' ' ')"

          # Only one PR can merge per run: branch protection wants an
          # up-to-date branch, so the first merge invalidates every other
          # branch this run just refreshed. Updating all of them would fire two
          # CI runs each (push + pull_request) and throw away all but one
          # result. Updating one drains the queue at exactly the same rate for
          # a fraction of the cost, and self-advances -- an updated branch that
          # comes back red simply stops being BEHIND, so the next run moves on
          # to the next one rather than stalling on it.
          UPDATES_LEFT=1

          for n in $PRS; do
            echo "::group::PR #$n"

            # GitHub computes mergeability lazily: the first query kicks the job
            # off and answers UNKNOWN. Four of the 14 stranded PRs (#1334 #1335
            # #1336 #1346) answered UNKNOWN and were skipped without a word,
            # which is the same quiet no-op the sweep exists to remove.
            STATE="UNKNOWN"
            for _ in 1 2 3 4 5; do
              STATE=$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus \
                        --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")
              [ "$STATE" != "UNKNOWN" ] && break
              sleep 3
            done
            echo "PR #$n merge state: $STATE"

            # Non-fatal throughout: one bad PR must not abort the sweep.
            if [ "$STATE" = "UNKNOWN" ]; then
              echo "::warning::PR #$n mergeability unresolved after 5 polls — next sweep will retry."
              echo "::endgroup::"
              continue
            fi

            # A conflicted PR is not up to date and never becomes BEHIND, so
            # without this it falls through to the arming branch: armed on a
            # conflict, auto-merge waits forever, and the log says only
            # "update type: patch". Observed live on #1335 and #1336 at 13:59
            # — every dependency bump edits requirements.txt, so each merge
            # makes a conflict likelier for whatever is left in the queue.
            #
            # Dependabot is the only actor that can fix it: the conflict is in
            # a file it generates, and it rebases its own PRs on request.
            if [ "$STATE" = "DIRTY" ]; then
              LAST=$(gh pr view "$n" --repo "$REPO" --json comments \
                       --jq '.comments[-1].body // ""' 2>/dev/null || echo "")
              case "$LAST" in
                *"$REBASE_MARKER"*)
                  echo "PR #$n has a merge conflict — rebase already requested, waiting."
                  ;;
                *)
                  echo "PR #$n has a merge conflict — asking Dependabot to rebase."
                  gh pr comment "$n" --repo "$REPO" --body "$REBASE_MARKER" \
                    2>/dev/null \
                    || echo "::warning::PR #$n is conflicted and could not be nudged."
                  ;;
              esac
              echo "::endgroup::"
              continue
            fi

            if [ "$STATE" = "BEHIND" ]; then
              # Branch protection refuses an out-of-date branch, so auto-merge
              # would sit armed and idle. Updating re-runs CI; the next sweep
              # arms it once the branch is current and CI has had its say.
              if [ "$UPDATES_LEFT" -le 0 ]; then
                echo "PR #$n is BEHIND — deferred to a later run (one update per run)."
                echo "::endgroup::"
                continue
              fi
              echo "PR #$n is BEHIND its base — updating the branch."
              UPDATES_LEFT=$((UPDATES_LEFT - 1))
              gh pr update-branch "$n" --repo "$REPO" \
                || gh pr comment "$n" --repo "$REPO" --body "@dependabot rebase" \
                || echo "::warning::PR #$n is behind and could not be updated."
              echo "::endgroup::"
              continue
            fi

            # Up to date, so nothing else will ever arm this PR. Classify before
            # doing so: rule 40 reserves a breaking dependency upgrade for a
            # human, and "unknown" is treated exactly like "major" — a verdict
            # the classifier could not reach is not one to merge unattended.
            if ! gh pr view "$n" --repo "$REPO" \
                   --json headRefName,commits > /tmp/pr-$n.json 2>/dev/null; then
              echo "::warning::PR #$n metadata unreadable — skipping."
              echo "::endgroup::"
              continue
            fi
            TYPE=$(python scripts/classify_dependabot_update.py "/tmp/pr-$n.json" \
                     2>/dev/null || echo "unknown")
            echo "PR #$n update type: $TYPE"

            case "$TYPE" in
              group|minor|patch)
                gh pr merge --auto --squash "$n" --repo "$REPO" \
                  || echo "::warning::PR #$n not auto-mergeable yet — leaving open."
                ;;
              *)
                echo "PR #$n is a '$TYPE' update — leaving it for human review."
                # Say so once. A daily sweep must not re-comment every morning.
                if ! gh pr view "$n" --repo "$REPO" --json comments \
                       --jq '.comments[].body' 2>/dev/null | grep -qF "$REVIEW_MARKER"; then
                  gh pr comment "$n" --repo "$REPO" --body \
                    "⚠️ **$REVIEW_MARKER** (\`$TYPE\`) — auto-merge skipped by the recovery sweep. Please review breaking changes before merging." \
                    2>/dev/null || true
                fi
                ;;
            esac
            echo "::endgroup::"
          done
