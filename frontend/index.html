<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
  <!-- The app shell is not a landing page; "/" serves home.html, which is the indexed page. -->
  <meta name="robots" content="noindex" />
  <meta name="description" content="Your AI team, on your own hardware. Hand work to specialist agents, watch what they do, and approve anything that matters." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <title>Autonomous AI Agency v5.0</title>

  <!-- Schema.org structured data for the SPA dashboard -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Autonomous AI Agency v5 Dashboard",
    "url": "https://autonomous-ai-agency.strikersam.workers.dev",
    "applicationCategory": "BusinessApplication",
    "description": "Admin dashboard for the Autonomous AI Agency v5 platform — manage companies, specialists, tasks, agents, and monitor system health.",
    "browserRequirements": "Requires JavaScript",
    "author": {
      "@type": "Person",
      "name": "StrikerSam"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply a saved light/dark choice before first paint (see src/theme.js).
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.js"></script>
</body>
</html>
